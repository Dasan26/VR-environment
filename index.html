<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio XR Multiplataforma</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene>
    <!-- CIELO Y PISO -->
    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>

    <!-- PARTE A: PRIMITIVAS BÁSICAS -->
    <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>
    <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

    <!-- CÁMARA FIX -->
    <a-entity position="0 1.6 2">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>
  </a-scene>

</body>
</html>
