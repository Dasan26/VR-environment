<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio XR - Visualizador CAD (.GLB)</title>
  
  <!-- Estilos de interfaz -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- A-Frame Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- Lógica de interacción JS -->
  <script src="js/cad-viewer.js"></script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hit-test;">
    
    <!-- GESTOR DE RECURSOS: Carga del archivo .glb -->
    <a-assets>
      <a-asset-item id="vscad" src="models/ensamble.glb"></a-asset-item>
    </a-assets>

    <!-- ILUMINACIÓN -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.65"></a-light>
    <a-light type="directional" position="-2 4 2" intensity="0.8" cast-shadow="true"></a-light>
    <a-light type="point" position="0 3 -2" intensity="0.4" color="#E2E8F0"></a-light>

    <!-- ENTIDAD DEL MODELO GLB -->
    <a-entity 
      gltf-model="#modelo-cad" 
      position="0 0 0" 
      rotation="0 45 0" 
      scale="1 1 1"
      rotar-cad="speed: 3">
    </a-entity>

    <!-- ENTORNO Y PISO DE PRUEBA -->
    <a-plane position="-0.2 1 -0.5" rotation="-90 0 0" width="1" height="1" color="#1E293B"></a-plane>
    <a-sky color="#0F172A"></a-sky>

    <!-- CÁMARA LIBRE -->
    <a-entity position="0 0 1.8">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>

  </a-scene>

</body>
</html>
